# Datasource Configuration
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = example_database_username
quarkus.datasource.password = example_database_password
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/postgres

# Hibernate Database Configuration
quarkus.hibernate-orm.database.generation.create-schemas = true
quarkus.hibernate-orm.database.default-schema = urwaldroute

## As suggested in https://quarkus.io/blog/hibernate-orm-config-profiles/
%dev.quarkus.hibernate-orm.database.generation = update
%dev-with-data.quarkus.hibernate-orm.database.generation = update

# Context Path
# https://quarkus.io/guides/http-reference#configuring-the-context-path
quarkus.http.root-path=/api
# Setting up cors for cross platform access.
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:8080,http://localhost:9090
