<div>
  <h2 class="subtitle">Create Path</h2>

  <div class="table" style="width: 40%; margin: auto">
    <table class="example-full-width">
      <thead>
      <tr>
        <th title="NamePath">Name of the Path you want to create:</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <th style="display: flex;">
          <input class="input" type="text" [(ngModel)]="newPath.name"name="name">
          <button mat-button *ngIf="newPath.name" matSuffix mat-icon-button aria-label="clear" (click)="newPath.name=''">
            <mat-icon>close</mat-icon>
          </button>
        </th>
      </tr>
      </tbody>
    </table>

    <table class="example-full-width">
      <thead>
      <tr>
        <th title="PathLength">Pick out the Checkpoints you want this Path to have:</th>
      </tr>
      </thead>
    </table>
  </div>
  <div style="display: flex;justify-content: center; margin-top: 1vw">
    <div class="control has-icons-left">
      <div class="select">
        <select  [multiple]="true" [(value)]="newPath.checkpoints">
            <option *ngFor="let item of checkpoints" [value]="item">{{item.name}}</option>
        </select>
      </div>
      <div class="icon is-small is-left">
        <i class="fas fa-globe"></i>
      </div>
    </div>
    <div>
      <button class="button" (click)="submitPath()">Create</button>
    </div>
  </div>
